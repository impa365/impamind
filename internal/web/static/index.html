<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101614">
<title>impamind</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="gate"></div>
<div id="app" hidden>

      <a href="/saude">Saúde</a>
      <a href="/cofre">Cofre</a>
      <a href="/tokens">Tokens</a>

    <button id="logout" class="text-btn" type="button">Sair</button>
  </aside>
  <main id="stage"></main>
</div>
<script src="/constellation.js"></script>
<script src="/obsidian-graph.js"></script>
<script src="/app.js"></script>

</html>
